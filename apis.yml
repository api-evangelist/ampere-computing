aid: ampere-computing
name: Ampere Computing
description: 'Ampere Computing is a Santa Clara, California semiconductor company founded
  in 2018 by Renee James and now part of the SoftBank Group. It designs Arm-based Cloud
  Native Processors — the Ampere Altra and Altra Max families (up to 128 cores) and
  the flagship AmpereOne family (up to 192 single-threaded cores) — for cloud, AI inference
  and edge deployments. Alongside the silicon it ships a software stack: Ampere Optimized
  AI frameworks (PyTorch, TensorFlow, ONNX Runtime, llama.cpp, Ollama) distributed as
  first-party container images, tuned GCC/glibc/binutils builds, performance and porting
  tooling, and an arm64 developer community. Ampere publishes no public developer API —
  its developer program is a hardware, tooling and porting program rather than an API
  program.'
